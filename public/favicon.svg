<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded squircle background with warm cheerful gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="balloonGrad" x1="18" y1="8" x2="38" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Radar waves (Storytime discovery) -->
  <path d="M41 15 C 47 19, 47 27, 41 31" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M47 10 C 55 16, 55 32, 47 38" stroke="#FEF08A" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Open Storybook -->
  <g filter="url(#shadow)">
    <path d="M12 49 C 19 46, 27 46, 32 49 C 37 46, 45 46, 52 49 L 52 38 C 45 35, 37 35, 32 38 C 27 35, 19 35, 12 38 Z" fill="#FFFFFF" />
    <!-- Book spine -->
    <line x1="32" y1="38" x2="32" y2="49" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />
    <!-- Book page details -->
    <line x1="16" y1="41" x2="27" y2="41" stroke="#FDA4AF" stroke-width="1.4" stroke-linecap="round" />
    <line x1="16" y1="45" x2="25" y2="45" stroke="#FDA4AF" stroke-width="1.4" stroke-linecap="round" />
    <line x1="37" y1="41" x2="48" y2="41" stroke="#FDA4AF" stroke-width="1.4" stroke-linecap="round" />
    <line x1="37" y1="45" x2="46" y2="45" stroke="#FDA4AF" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Floating Storytime Balloon / Radar beacon -->
  <circle cx="28" cy="19" r="9.5" fill="url(#balloonGrad)" />
  <path d="M26 28.5 L 30 28.5 L 28 31 Z" fill="#D97706" />
  <!-- Balloon specular highlight -->
  <path d="M24 15 C 24 13.5, 25.5 12.5, 27.5 12.5" stroke="#FFFBEB" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <!-- Balloon string floating down into the book -->
  <path d="M28 31 C 26.5 34, 30 35, 31.5 38" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.9" />

  <!-- Sparkle star -->
  <path d="M42 22 L 43.2 24.8 L 46 26 L 43.2 27.2 L 42 30 L 40.8 27.2 L 38 26 L 40.8 24.8 Z" fill="#FEF08A" />
  <circle cx="16" cy="18" r="1.5" fill="#FEF08A" opacity="0.8" />
</svg>
